<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Ledger — StockSense IMS</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
    <!-- Design & Stylesheets -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/table.css">
    <link rel="stylesheet" href="css/mobile.css">
</head>
<body>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar-container" id="sidebar-container"></aside>

        <!-- Main Content Area -->
        <main class="main-wrapper">
            <!-- Topbar Header -->
            <header class="topbar-container" id="topbar-container"></header>

            <!-- Page Body -->
            <div class="page-body">
                
                <!-- Section Header -->
                <div class="section-header-bar">
                    <div>
                        <h2 class="section-title">Stock Ledger & Audit Trail</h2>
                        <p class="section-subtitle" id="ledger-count">Cryptographically signed, append-only record of all stock transactions</p>
                    </div>
                    <div style="display:flex; background:#EDE7F6; padding:4px; border-radius:var(--radius-full); gap:4px;">
                        <button type="button" class="btn btn-sm btn-primary" id="btn-view-ledger" style="border-radius:var(--radius-full); padding:6px 16px; font-weight:700;">Stock Movements</button>
                        <button type="button" class="btn btn-sm" id="btn-view-audit" style="border-radius:var(--radius-full); padding:6px 16px; font-weight:700; background:transparent; color:var(--primary); border:none;">System Audit Trail</button>
                    </div>
                </div>

                <!-- Filters Bar -->
                <div class="table-toolbar" style="background:#FFFFFF; padding:18px; border-radius:var(--radius-lg); border:1px solid var(--border-color); box-shadow:var(--shadow-card);">
                    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap:12px; width:100%;">
                        <div>
                            <label class="form-label" style="font-size:11px; text-transform:uppercase;">Product Filter</label>
                            <select id="ledger-filter-product" class="form-select"></select>
                        </div>

                        <div>
                            <label class="form-label" style="font-size:11px; text-transform:uppercase;">Warehouse</label>
                            <select id="ledger-filter-warehouse" class="form-select"></select>
                        </div>

                        <div>
                            <label class="form-label" style="font-size:11px; text-transform:uppercase;">Doc Type</label>
                            <select id="ledger-filter-type" class="form-select">
                                <option value="">All Document Types</option>
                                <option value="Receipt">Receipts (+ Intake)</option>
                                <option value="Delivery">Deliveries (- Outtake)</option>
                                <option value="Transfer">Transfers (Relocation)</option>
                                <option value="Adjustment">Adjustments (Audit Delta)</option>
                            </select>
                        </div>

                        <div>
                            <label class="form-label" style="font-size:11px; text-transform:uppercase;">Transaction Date</label>
                            <input type="date" id="ledger-filter-date" class="form-input">
                        </div>

                        <div style="display:flex; align-items:flex-end;">
                            <button type="button" class="btn btn-outline" id="btn-reset-filters" style="width:100%; height:44px;">
                                🔄 Reset Filters
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Ledger Table -->
                <div class="table-responsive" style="margin-top:20px;">
                    <table class="data-table">
                        <thead id="ledger-table-head">
                            <tr>
                                <th style="width: 120px;">Date</th>
                                <th>Product Item</th>
                                <th style="width: 130px;">Document Type</th>
                                <th style="width: 120px;">Delta Qty</th>
                                <th>Warehouse Location</th>
                                <th style="width: 140px;">Document Ref</th>
                            </tr>
                        </thead>
                        <tbody id="ledger-table-body">
                            <!-- Populated dynamically via ledger.js -->
                        </tbody>
                    </table>
                </div>

            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/ledger.js"></script>
</body>
</html>
