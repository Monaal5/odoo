<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Adjustments — StockSense IMS</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
    <!-- Design & Stylesheets -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/table.css">
    <link rel="stylesheet" href="css/mobile.css">
</head>
<body>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar-container" id="sidebar-container"></aside>

        <!-- Main Content Area -->
        <main class="main-wrapper">
            <!-- Topbar Header -->
            <header class="topbar-container" id="topbar-container"></header>

            <!-- Page Body -->
            <div class="page-body">
                
                <!-- Section Header -->
                <div class="section-header-bar">
                    <div>
                        <h2 class="section-title">Stock Count Adjustments</h2>
                        <p class="section-subtitle">Reconcile physical inventory counts against system records</p>
                    </div>
                </div>

                <!-- Form Card: Reconcile Physical Count -->
                <div style="background:#FFFFFF; border:1px solid var(--border-color); border-radius:var(--radius-lg); padding:28px; margin-bottom:32px; box-shadow:var(--shadow-card);">
                    <h3 style="font-size:16px; font-weight:800; margin-bottom:16px; color:var(--text-main);">Log Physical Stock Count</h3>
                    
                    <form id="adjustment-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="adj-product">Product to Reconcile *</label>
                                <select id="adj-product" class="form-select" required></select>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="adj-warehouse">Audit Warehouse *</label>
                                <select id="adj-warehouse" class="form-select" required></select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="adj-counted-qty">Physically Counted Quantity *</label>
                                <input type="number" id="adj-counted-qty" class="form-input" placeholder="e.g. 118" min="0" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="adj-reason">Audit Reason / Justification</label>
                                <input type="text" id="adj-reason" class="form-input" placeholder="e.g. Broken packaging, cycle count variance, found surplus">
                            </div>
                        </div>

                        <div style="display:flex; justify-content:flex-end; margin-top:12px;">
                            <button type="submit" class="btn btn-primary" id="btn-submit-adjustment">
                                <span>⚖️ Post Count Adjustment</span>
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Adjustment Ledger History -->
                <div class="section-header-bar" style="margin-bottom:16px;">
                    <div>
                        <h3 style="font-size:17px; font-weight:800;">Recent Adjustment Records</h3>
                        <p class="section-subtitle">Audit entries committed to the immutable Stock Ledger</p>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th style="width: 130px;">Date</th>
                                <th>Product Item</th>
                                <th>Warehouse</th>
                                <th style="width: 120px;">Physical Count</th>
                                <th style="width: 120px;">Ledger Delta</th>
                                <th>Reason</th>
                            </tr>
                        </thead>
                        <tbody id="adjustments-table-body">
                            <!-- Populated dynamically via adjustments.js -->
                        </tbody>
                    </table>
                </div>

            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/adjustments.js"></script>
</body>
</html>
