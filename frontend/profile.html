<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings — StockSense IMS</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
    <!-- Design & Stylesheets -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/table.css">
    <link rel="stylesheet" href="css/mobile.css">
</head>
<body>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar-container" id="sidebar-container"></aside>

        <!-- Main Content Area -->
        <main class="main-wrapper">
            <!-- Topbar Header -->
            <header class="topbar-container" id="topbar-container"></header>

            <!-- Page Body -->
            <div class="page-body">
                
                <!-- Section Header -->
                <div class="section-header-bar">
                    <div>
                        <h2 class="section-title">Account & Profile Settings</h2>
                        <p class="section-subtitle">Manage identity credentials and warehouse operational security</p>
                    </div>
                </div>

                <!-- Two-column settings layout -->
                <div style="display:grid; grid-template-columns: 1fr 2fr; gap:28px;">
                    
                    <!-- Left: Profile Summary Card -->
                    <div style="background:#FFFFFF; border:1px solid var(--border-color); border-radius:var(--radius-lg); padding:32px 24px; box-shadow:var(--shadow-card); text-align:center; height:fit-content;">
                        <div id="profile-display-avatar" style="width:72px; height:72px; border-radius:50%; background:linear-gradient(135deg, var(--primary), #7E57C2); color:#fff; display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:800; margin:0 auto 16px auto; box-shadow:0 8px 16px var(--primary-glow);">
                            A
                        </div>
                        <h3 id="profile-display-name" style="font-size:18px; font-weight:800; color:var(--text-main);">Alex Vance</h3>
                        <p id="profile-display-email" style="font-size:13px; color:var(--text-muted); margin-bottom:12px;">admin@stocksense.io</p>
                        <span class="status-badge badge-done" style="font-size:11px;">Active Operator</span>

                        <div style="margin-top:28px; border-top:1px solid var(--border-color); padding-top:20px;">
                            <button type="button" class="btn btn-outline btn-sm" id="btn-profile-logout" style="width:100%; color:var(--danger); border-color:#FECACA;">
                                🚪 Sign Out of StockSense
                            </button>
                        </div>
                    </div>

                    <!-- Right: Forms Column -->
                    <div style="display:flex; flex-direction:column; gap:24px;">
                        
                        <!-- 1. Profile Details Card -->
                        <div style="background:#FFFFFF; border:1px solid var(--border-color); border-radius:var(--radius-lg); padding:28px; box-shadow:var(--shadow-card);">
                            <h3 style="font-size:16px; font-weight:800; margin-bottom:18px;">Personal Information</h3>

                            <form id="profile-form">
                                <div class="form-row">
                                    <div class="form-group">
                                        <label class="form-label" for="profile-name">Full Name *</label>
                                        <input type="text" id="profile-name" class="form-input" required>
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label" for="profile-email">Email Address *</label>
                                        <input type="email" id="profile-email" class="form-input" required>
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label class="form-label" for="profile-role">Assigned IMS Role</label>
                                    <input type="text" id="profile-role" class="form-input" readonly style="background:#F8FAFC; color:var(--text-muted); cursor:not-allowed;">
                                </div>

                                <div style="display:flex; justify-content:flex-end; margin-top:14px;">
                                    <button type="submit" class="btn btn-primary" id="btn-save-profile">
                                        <span>Save Profile</span>
                                    </button>
                                </div>
                            </form>
                        </div>

                        <!-- 2. Change Password Card -->
                        <div style="background:#FFFFFF; border:1px solid var(--border-color); border-radius:var(--radius-lg); padding:28px; box-shadow:var(--shadow-card);">
                            <h3 style="font-size:16px; font-weight:800; margin-bottom:18px;">Security & Password</h3>

                            <form id="password-form">
                                <div class="form-group">
                                    <label class="form-label" for="current-password">Current Password</label>
                                    <input type="password" id="current-password" class="form-input" placeholder="••••••••">
                                </div>

                                <div class="form-row">
                                    <div class="form-group">
                                        <label class="form-label" for="new-password">New Password</label>
                                        <input type="password" id="new-password" class="form-input" placeholder="Minimum 6 characters" minlength="6" required>
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label" for="confirm-password">Confirm New Password</label>
                                        <input type="password" id="confirm-password" class="form-input" placeholder="Repeat new password" minlength="6" required>
                                    </div>
                                </div>

                                <div style="display:flex; justify-content:flex-end; margin-top:14px;">
                                    <button type="submit" class="btn btn-outline" id="btn-save-password">
                                        <span>Update Password</span>
                                    </button>
                                </div>
                            </form>
                        </div>

                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
