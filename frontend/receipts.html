<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inbound Receipts — StockSense IMS</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
    <!-- Design & Stylesheets -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/table.css">
    <link rel="stylesheet" href="css/mobile.css">
</head>
<body>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar-container" id="sidebar-container"></aside>

        <!-- Main Content Area -->
        <main class="main-wrapper">
            <!-- Topbar Header -->
            <header class="topbar-container" id="topbar-container"></header>

            <!-- Page Body -->
            <div class="page-body">
                
                <!-- Section Header -->
                <div class="section-header-bar">
                    <div>
                        <h2 class="section-title">Inbound Receipts</h2>
                        <p class="section-subtitle">Receive purchase orders & validate intake to increase stock</p>
                    </div>
                    <div style="display:flex; gap:10px; flex-wrap:wrap;">
                        <input type="file" id="ocr-file-input" accept="image/*,.pdf,.txt" style="display:none;">
                        <button class="btn btn-outline" id="btn-ocr-scan" style="display:inline-flex; align-items:center; gap:8px; font-weight:700;">
                            <span>📄 Scan Invoice (OCR)</span>
                        </button>
                        <button class="btn btn-primary" id="btn-new-receipt">
                            <span>📥 Create Receipt</span>
                        </button>
                    </div>
                </div>

                <!-- Table Search & Filter -->
                <div class="table-toolbar">
                    <div class="table-search-group">
                        <div class="search-input-wrap">
                            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                            <input type="text" id="receipt-search-input" class="search-input" placeholder="Search by receipt number or supplier name...">
                        </div>
                    </div>
                </div>

                <!-- Receipts Table -->
                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th style="width: 140px;">Receipt #</th>
                                <th>Supplier</th>
                                <th>Items Summary</th>
                                <th style="width: 130px;">Date Created</th>
                                <th style="width: 120px;">Status</th>
                                <th style="width: 130px;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="receipts-table-body">
                            <!-- Populated dynamically via receipts.js -->
                        </tbody>
                    </table>
                </div>

            </div>
        </main>
    </div>

    <!-- CREATE RECEIPT MODAL -->
    <div class="modal-overlay" id="modal-receipt">
        <div class="modal-card modal-lg">
            <div class="modal-header">
                <h3 class="modal-title">Create Inbound Stock Receipt</h3>
                <button type="button" class="modal-close" data-close-modal="modal-receipt">&times;</button>
            </div>

            <form id="receipt-form">
                <div class="modal-body">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="receipt-supplier">Supplier / Vendor *</label>
                            <input type="text" id="receipt-supplier" class="form-input" placeholder="e.g. Apex Industrial Steel Corp" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="receipt-warehouse">Receiving Warehouse</label>
                            <select id="receipt-warehouse" class="form-select"></select>
                        </div>
                    </div>

                    <!-- Line Item Builder Box -->
                    <div style="background:#F1F5F9; border-radius:var(--radius-md); padding:16px; margin:16px 0; border:1px solid var(--border-color);">
                        <h4 style="font-size:13px; font-weight:700; margin-bottom:12px; color:var(--text-main);">Add Items to Intake Order</h4>
                        
                        <div class="form-row" style="align-items:flex-end;">
                            <div class="form-group" style="flex:2; margin-bottom:0;">
                                <label class="form-label" for="receipt-product-select">Product SKU / Title</label>
                                <select id="receipt-product-select" class="form-select"></select>
                            </div>
                            <div class="form-group" style="flex:1; margin-bottom:0;">
                                <label class="form-label" for="receipt-item-qty">Quantity</label>
                                <input type="number" id="receipt-item-qty" class="form-input" placeholder="e.g. 50" min="1" step="any">
                            </div>
                            <button type="button" class="btn btn-outline" id="btn-add-line-item" style="height:44px;">
                                ➕ Add Item
                            </button>
                        </div>

                        <!-- Draft Items Preview -->
                        <div style="margin-top:14px;">
                            <label class="form-label" style="font-size:12px;">Staged Line Items:</label>
                            <div id="draft-items-list">
                                <!-- Populated dynamically -->
                            </div>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" data-close-modal="modal-receipt">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="btn-submit-receipt">Create Receipt Order</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/receipts.js"></script>
</body>
</html>
