<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products — StockSense IMS</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
    <!-- Design & Stylesheets -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/table.css">
    <link rel="stylesheet" href="css/mobile.css">
</head>
<body>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar-container" id="sidebar-container"></aside>

        <!-- Main Content Area -->
        <main class="main-wrapper">
            <!-- Topbar Header -->
            <header class="topbar-container" id="topbar-container"></header>

            <!-- Page Body -->
            <div class="page-body">
                
                <!-- Section Header -->
                <div class="section-header-bar">
                    <div>
                        <h2 class="section-title">Product Catalog</h2>
                        <p class="section-subtitle" id="products-count">Manage items, stock thresholds, and SKUs</p>
                    </div>
                    <button class="btn btn-primary" id="btn-add-product">
                        <span>➕ Add Product</span>
                    </button>
                </div>

                <!-- Table Filter & Search Toolbar -->
                <div class="table-toolbar">
                    <div class="table-search-group">
                        <div class="search-input-wrap">
                            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                            <input type="text" id="product-search-input" class="search-input" placeholder="Search by SKU (e.g. STL001) or product name...">
                        </div>
                    </div>

                    <div class="table-filters">
                        <select id="category-filter" class="form-select" style="min-width: 180px;">
                            <option value="">All Categories</option>
                        </select>
                    </div>
                </div>

                <!-- Products Table -->
                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th style="width: 140px;">SKU</th>
                                <th>Product Name & Specs</th>
                                <th>Category</th>
                                <th style="width: 120px;">Qty On-Hand</th>
                                <th style="width: 140px;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="products-table-body">
                            <!-- Populated dynamically via products.js -->
                        </tbody>
                    </table>
                </div>

                <!-- Table Pagination -->
                <div class="table-pagination">
                    <span>Showing active catalog items</span>
                    <div class="pagination-controls">
                        <button class="page-btn" disabled>&laquo;</button>
                        <button class="page-btn active">1</button>
                        <button class="page-btn">&raquo;</button>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- ADD / EDIT PRODUCT MODAL -->
    <div class="modal-overlay" id="modal-product">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title" id="modal-product-title">Add New Product</h3>
                <button type="button" class="modal-close" data-close-modal="modal-product">&times;</button>
            </div>
            
            <form id="product-form">
                <input type="hidden" id="product-id">
                
                <div class="modal-body">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="product-sku">SKU Code *</label>
                            <input type="text" id="product-sku" class="form-input" placeholder="e.g. STL001" required style="font-family:'JetBrains Mono', monospace; text-transform:uppercase;">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="product-category">Category</label>
                            <select id="product-category" class="form-select">
                                <option value="">Select Category</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="product-name">Product Name *</label>
                        <input type="text" id="product-name" class="form-input" placeholder="e.g. Steel Rod 12mm High-Tensile" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="product-uom">Unit of Measure</label>
                            <input type="text" id="product-uom" class="form-input" placeholder="units, kg, pcs, meters" value="units">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="product-reorder-min">Min Reorder Level</label>
                            <input type="number" id="product-reorder-min" class="form-input" value="10" min="0">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="product-reorder-max">Max Capacity</label>
                            <input type="number" id="product-reorder-max" class="form-input" value="500" min="0">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="product-desc">Description / Notes</label>
                        <textarea id="product-desc" class="form-textarea" placeholder="Optional specifications or warehouse bin instructions..."></textarea>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" data-close-modal="modal-product">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="btn-save-product">Save Product</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/products.js"></script>
</body>
</html>
